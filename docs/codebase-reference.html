<title>myIU Codebase Reference</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f8fafc;
    --surface:  #ffffff;
    --border:   #e2e8f0;
    --text:     #1e293b;
    --muted:    #64748b;
    --accent:   #0057A8;
    --accent2:  #0284c7;
    --portal:   #0057A8;
    --admin:    #7c3aed;
    --chip-bg:  #f1f5f9;
    --chip-fg:  #334155;
    --fn-bg:    #f8fafc;
    --fn-fg:    #1e40af;
    --shadow:   0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --border:  #334155;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --chip-bg: #1e293b;
      --chip-fg: #94a3b8;
      --fn-bg:   #1e293b;
      --fn-fg:   #7dd3fc;
      --shadow:  0 1px 3px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg:      #0f172a; --surface: #1e293b; --border: #334155;
    --text:    #e2e8f0; --muted:   #94a3b8;
    --chip-bg: #1e293b; --chip-fg: #94a3b8;
    --fn-bg:   #1e293b; --fn-fg:   #7dd3fc;
    --shadow:  0 1px 3px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --bg:#f8fafc; --surface:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
    --chip-bg:#f1f5f9; --chip-fg:#334155; --fn-bg:#f8fafc; --fn-fg:#1e40af; --shadow:0 1px 3px rgba(0,0,0,.08);
  }

  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ── */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; padding: 14px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: var(--shadow); }
  .header-title { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header-title h1 { font-size: 15px; font-weight: 700; color: var(--text); }
  .header-title .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--accent); color: #fff; }
  .search-wrap { flex: 1; min-width: 200px; max-width: 380px; position: relative; }
  .search-wrap input { width: 100%; padding: 7px 10px 7px 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
  .tab-btn { padding: 8px 18px; font-size: 13px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; border-radius: 0; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active-portal { color: var(--portal); border-bottom-color: var(--portal); }
  .tab-btn.active-admin  { color: var(--admin);  border-bottom-color: var(--admin); }

  /* ── Table wrapper ── */
  .content { display: none; padding: 20px; }
  .content.active { display: block; }
  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .tbl-wrap .overflow { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: var(--bg); }
  th { padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; border-bottom: 1px solid var(--border); }
  th:nth-child(1) { width: 200px; }
  th:nth-child(2) { width: 240px; }
  th:nth-child(3) { }
  td { padding: 10px 14px; vertical-align: top; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr.hidden { display: none; }
  tr:hover td { background: rgba(0,87,168,.03); }

  /* ── Feature cell ── */
  .feat { display: flex; flex-direction: column; gap: 4px; }
  .feat-name { font-weight: 600; font-size: 13px; color: var(--text); line-height: 1.3; }
  .proj-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; width: fit-content; }
  .proj-badge.portal { background: rgba(0,87,168,.1); color: var(--portal); }
  .proj-badge.admin  { background: rgba(124,58,237,.1); color: var(--admin); }

  /* ── Vars cell ── */
  .vars { display: flex; flex-wrap: wrap; gap: 4px; }
  .var-chip { display: inline-block; font-family: 'Menlo', 'Consolas', monospace; font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: var(--chip-bg); color: var(--chip-fg); white-space: nowrap; border: 1px solid var(--border); }
  .no-var { font-size: 11px; color: var(--muted); font-style: italic; }

  /* ── Functions cell ── */
  .fns { display: flex; flex-direction: column; gap: 2px; max-height: 130px; overflow-y: auto; padding-right: 2px; }
  .fns::-webkit-scrollbar { width: 3px; }
  .fns::-webkit-scrollbar-track { background: transparent; }
  .fns::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .fn-item { font-family: 'Menlo', 'Consolas', monospace; font-size: 11px; color: var(--fn-fg); white-space: nowrap; }

  /* ── Empty ── */
  .empty { padding: 48px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ── Legend ── */
  .legend { display: flex; gap: 16px; padding: 0 20px 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
</style>

<div class="header">
  <div class="header-title">
    <h1>myIU Codebase Reference</h1>
    <span class="badge">var · function · feature</span>
  </div>
  <div class="search-wrap">

    <input type="search" id="q" placeholder="Search feature, var, function…" autocomplete="off" />

</div>

<div class="tabs">

<div class="legend">

function makeRow(row, proj) {
  const tr = document.createElement('tr');
  tr.dataset.text = [row.feature, ...row.vars, ...row.fns].join(' ').toLowerCase();

  // Feature cell
  const tdF = document.createElement('td');
  tdF.innerHTML = `<div class="feat"><span class="feat-name">${row.feature}</span><span class="proj-badge ${proj}">${proj}</span></div>`;

  // Vars cell
  const tdV = document.createElement('td');
  if (row.vars.length === 0) {
    tdV.innerHTML = '<span class="no-var">—</span>';
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'vars';
    row.vars.forEach(v => { const s = document.createElement('span'); s.className = 'var-chip'; s.textContent = v; wrap.appendChild(s); });
    tdV.appendChild(wrap);
  }

  // Functions cell
  const tdFn = document.createElement('td');
  const list = document.createElement('div');
  list.className = 'fns';
  row.fns.forEach(f => { const s = document.createElement('span'); s.className = 'fn-item'; s.textContent = f; list.appendChild(s); });
  tdFn.appendChild(list);

  tr.appendChild(tdF); tr.appendChild(tdV); tr.appendChild(tdFn);
  return tr;
}

function render(data, bodyId, proj) {
  const tbody = document.getElementById(bodyId);
  data.forEach(row => tbody.appendChild(makeRow(row, proj)));
}
render(PORTAL, 'body-portal', 'portal');
render(ADMIN,  'body-admin',  'admin');

// ── Tabs ──
let activeTab = 'portal';
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
    btn.classList.add(activeTab === 'portal' ? 'active-portal' : 'active-admin');
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + activeTab).classList.add('active');
    updateCount();
  });
});

// ── Search ──
function updateCount() {
  const tbody = document.getElementById('body-' + activeTab);
  const rows = tbody.querySelectorAll('tr');
  const visible = [...rows].filter(r => !r.classList.contains('hidden')).length;
  document.getElementById('cnt').textContent = visible + ' / ' + rows.length + ' features';
}

document.getElementById('q').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  ['portal','admin'].forEach(proj => {
    const tbody = document.getElementById('body-' + proj);
    tbody.querySelectorAll('tr').forEach(tr => {
      tr.classList.toggle('hidden', q.length > 0 && !tr.dataset.text.includes(q));
    });
  });
  updateCount();
});

updateCount();
</script>
