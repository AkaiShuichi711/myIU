<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 48" fill="none" role="img" aria-label="International University">

  <defs>
    <!-- Top arc: math 200°→340°, sweep=1 (screen CW over screen-top) — text reads L→R from outside ✓ -->
    <path id="seal-top" d="M 7,18 A 18.5,18.5 0 0,1 41,18"/>
    <!-- Bottom arc: math 140°→40°, sweep=0 (screen CCW through screen-bottom) — text reads L→R from outside ✓ -->
    <path id="seal-bot" d="M 10,36 A 18.5,18.5 0 0,0 38,36"/>
  </defs>

  <!-- SEAL: outer ring -->
  <circle cx="24" cy="24" r="22" stroke="white" stroke-width="1.1" fill="none"/>
  <!-- SEAL: inner ring (bounds the mark area) -->
  <circle cx="24" cy="24" r="15.5" stroke="white" stroke-width="0.6" fill="none" opacity="0.80"/>

  <!-- SEAL: top circular text -->
  <text font-size="2.6" fill="white" font-family="Arial, sans-serif" opacity="0.82" letter-spacing="0.08">
    <textPath href="#seal-top" startOffset="3%">HOCHIMINH CITY INTERNATIONAL UNIVERSITY</textPath>
  </text>
  <!-- SEAL: bottom circular text -->
  <text font-size="2.6" fill="white" font-family="Arial, sans-serif" opacity="0.82" letter-spacing="1.0">
    <textPath href="#seal-bot" startOffset="14%">• HCM • IU •</textPath>
  </text>

  <!-- IU MARK: upper sphere — solid white (prominent, matches teal in official logo) -->
  <circle cx="24" cy="18.5" r="5.5" fill="white"/>
  <!-- IU MARK: lower rectangle — outline only (navy interior = background shows through, matches navy rect in official logo) -->
  <rect x="18.5" y="24" width="11" height="9" rx="1.5" stroke="white" stroke-width="0.9" fill="none"/>

  <!-- TEXT: subtitle -->
  <text
    x="52" y="19"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="8.5" font-weight="400" letter-spacing="0.4"
    fill="rgba(255,255,255,0.72)"
  >VIET NAM NATIONAL UNIVERSITY HO CHI MINH CITY</text>

  <!-- TEXT: main title -->
  <text
    x="52" y="37"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="17" font-weight="700" letter-spacing="0.4"
    fill="white"
  >INTERNATIONAL UNIVERSITY</text>

</svg>
