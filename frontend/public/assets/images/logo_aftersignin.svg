<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 48" fill="none" role="img" aria-label="International University">

  <defs>
    <!--
      Top arc: math 170°→10° via 270° (screen-top), 200° arc, sweep=1 large-arc=1
      At screen-top, sweep=1 direction = RIGHTWARD → text reads L-to-R from outside ✓
    -->
    <path id="seal-top" d="M 6,27 A 18.5,18.5 0 1,1 42,27"/>
    <!--
      Bottom arc: math 140°→40° via 90° (screen-bottom), 100° arc, sweep=0 small-arc
      At screen-bottom, sweep=0 direction = RIGHTWARD → text reads L-to-R from outside ✓
    -->
    <path id="seal-bot" d="M 10,36 A 18.5,18.5 0 0,0 38,36"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" stroke="white" stroke-width="1.1" fill="none"/>
  <!-- Inner ring -->
  <circle cx="24" cy="24" r="15.5" stroke="white" stroke-width="0.7" fill="none" opacity="0.85"/>

  <!-- Top circular text: "HO CHI MINH CITY INTERNATIONAL UNIVERSITY" -->
  <text font-size="2.6" fill="white" font-family="Arial, sans-serif" opacity="0.88" letter-spacing="-0.08">
    <textPath href="#seal-top" startOffset="5%">HO CHI MINH CITY INTERNATIONAL UNIVERSITY</textPath>
  </text>
  <!-- Bottom circular text: "• HCM - IU •" -->
  <text font-size="2.6" fill="white" font-family="Arial, sans-serif" opacity="0.88" letter-spacing="0.9">
    <textPath href="#seal-bot" startOffset="12%">• HCM - IU •</textPath>
  </text>

  <!-- IU mark: sphere — solid white fill -->
  <circle cx="24" cy="20" r="6" fill="white"/>
  <!-- IU mark: body — solid white fill, 2-unit gap so navy bg separates the two shapes -->
  <rect x="18" y="28" width="12" height="9" rx="2" fill="white"/>

  <!-- Subtitle -->
  <text
    x="52" y="19"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="8.5" font-weight="400" letter-spacing="0.4"
    fill="rgba(255,255,255,0.72)"
  >VIET NAM NATIONAL UNIVERSITY HO CHI MINH CITY</text>

  <!-- Main title -->
  <text
    x="52" y="37"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="17" font-weight="700" letter-spacing="0.4"
    fill="white"
  >INTERNATIONAL UNIVERSITY</text>

</svg>
