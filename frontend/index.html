<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favico.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myIU</title>
    <script>
      // Apply saved language BEFORE Google Translate loads so it auto-translates on mount
      (function () {
        var lang = localStorage.getItem('myiu_lang');
        if (lang && lang !== 'vi') {
          document.cookie = 'googtrans=/vi/' + lang + '; path=/';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Google Translate widget mount point -->
    <div id="google_translate_element" style="display:none;position:absolute;width:0;height:0;overflow:hidden;"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      function googleTranslateElementInit() {
        new window.google.translate.TranslateElement({
          pageLanguage: 'vi',
          autoDisplay: false,
          includedLanguages: 'vi,en,zh-CN,ja,ko,th,fr,de,es,ru,ar,id',
        }, 'google_translate_element');
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
  </body>
</html>
