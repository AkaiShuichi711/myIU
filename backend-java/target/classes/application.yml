server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myIU_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway handles DDL; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:myiu-super-secret-key-change-in-production-min-256bit}
    expiration-ms: 86400000        # 24 hours

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: http://localhost:8080

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"

logging:
  level:
    com.myiu: DEBUG
    org.springframework.security: INFO
