# ─────────────────────────────────────────────────────────────────
#  DEV environment — full stack trên dev server
#  DB: myiu_dev
#
#  Cần file .env.dev với các biến bên dưới.
#  Deploy: docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
# ─────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    container_name: myiu-postgres-dev
    environment:
      POSTGRES_DB: myiu_dev
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d myiu_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Do NOT expose 5432 to host on shared dev server — only internal traffic
    networks:
      - myiu-dev

  portal-backend:
    image: ${REGISTRY:-ghcr.io/yourorg}/myiu-portal-backend:${TAG:-latest}
    container_name: myiu-portal-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/myiu_dev
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${PORTAL_JWT_SECRET}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      FRONTEND_URL: ${PORTAL_FRONTEND_URL}
      APP_BASE_URL: ${PORTAL_API_URL}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - portal-uploads-dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - myiu-dev

  admin-backend:
    image: ${REGISTRY:-ghcr.io/yourorg}/myiu-admin-backend:${TAG:-latest}
    container_name: myiu-admin-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/myiu_dev
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      APP_BASE_URL: ${ADMIN_API_URL}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8081:8081"
    volumes:
      - admin-uploads-dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - myiu-dev

  portal-frontend:
    image: ${REGISTRY:-ghcr.io/yourorg}/myiu-portal-frontend:${TAG:-latest}
    container_name: myiu-portal-frontend-dev
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - myiu-dev

  admin-frontend:
    image: ${REGISTRY:-ghcr.io/yourorg}/myiu-admin-frontend:${TAG:-latest}
    container_name: myiu-admin-frontend-dev
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - myiu-dev

networks:
  myiu-dev:
    name: myiu-dev-network

volumes:
  postgres-dev-data:
    name: myiu-postgres-dev
  portal-uploads-dev:
    name: myiu-portal-uploads-dev
  admin-uploads-dev:
    name: myiu-admin-uploads-dev
