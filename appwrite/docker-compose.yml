# Minimal Appwrite docker-compose reference.
# NOTE: Use the official Appwrite installation guide for the latest, supported compose file:
# https://appwrite.io/docs/installation

version: '3.6'
services:
  appwrite:
    image: appwrite/appwrite:1.0.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      _APP_ENV: development
      # Generate a long random value for this key before production
      _APP_OPENSSL_KEY_V1: "replace-with-a-secure-random-key"
    volumes:
      - ./storage:/storage
    networks:
      - appwrite

networks:
  appwrite:
    driver: bridge

# This is a minimal placeholder. Appwrite Quickstart includes additional services
# (mariadb, redis, smtp, etc.) and more environment settings. Follow the official
# docs to get a fully-working production/dev compose file.