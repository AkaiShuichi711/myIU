# ─────────────────────────────────────────────────────────────────
#  DEPLOY → DEV
#  Triggers: push to develop branch (after CI passes)
#  DB: myiu_dev
#
#  Required GitHub Secrets:
#    REGISTRY            — e.g. ghcr.io/yourorg
#    DEV_SSH_HOST        — dev server IP/hostname
#    DEV_SSH_USER        — SSH username
#    DEV_SSH_KEY         — private SSH key (Ed25519 recommended)
#    DEV_DB_USERNAME     — postgres username
#    DEV_DB_PASSWORD     — postgres password
#    DEV_PORTAL_JWT      — portal JWT secret (min 256 bit)
#    DEV_ADMIN_JWT       — admin JWT secret
#    DEV_AZURE_CLIENT_ID / DEV_AZURE_CLIENT_SECRET / DEV_AZURE_TENANT_ID
#    DEV_PORTAL_FRONTEND_URL  — e.g. https://dev.myiu.edu.vn
#    DEV_ADMIN_FRONTEND_URL   — e.g. https://dev-admin.myiu.edu.vn
#    DEV_PORTAL_API_URL       — e.g. https://dev-api.myiu.edu.vn
#    DEV_ADMIN_API_URL        — e.g. https://dev-admin-api.myiu.edu.vn
# ─────────────────────────────────────────────────────────────────
name: Deploy → Dev

on:
  push:
    branches: [develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  TAG: dev-${{ github.sha }}

jobs:
  deploy-dev:
    name: Build, push & deploy to dev
    runs-on: ubuntu-latest
    environment: dev          # GitHub environment for approval gates (optional)

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (layer caching)
        uses: docker/setup-buildx-action@v3

      # ── Build & push all 4 images in parallel via matrix (future) ──
      - name: Build & push portal backend
        uses: docker/build-push-action@v6
        with:
          context: backend-java
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/myiu-portal-backend:${{ env.TAG }}
            ${{ secrets.REGISTRY }}/myiu-portal-backend:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin backend
        uses: docker/build-push-action@v6
        with:
          context: myIU-admin/backend
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/myiu-admin-backend:${{ env.TAG }}
            ${{ secrets.REGISTRY }}/myiu-admin-backend:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push portal frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: VITE_API_URL=${{ secrets.DEV_PORTAL_API_URL }}
          tags: |
            ${{ secrets.REGISTRY }}/myiu-portal-frontend:${{ env.TAG }}
            ${{ secrets.REGISTRY }}/myiu-portal-frontend:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin frontend
        uses: docker/build-push-action@v6
        with:
          context: myIU-admin/frontend
          push: true
          build-args: VITE_API_URL=${{ secrets.DEV_ADMIN_API_URL }}
          tags: |
            ${{ secrets.REGISTRY }}/myiu-admin-frontend:${{ env.TAG }}
            ${{ secrets.REGISTRY }}/myiu-admin-frontend:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e
            cd /opt/myiu

            # Write env file for this deploy
            cat > .env.dev <<EOF
            REGISTRY=${{ secrets.REGISTRY }}
            TAG=${{ env.TAG }}
            DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            PORTAL_JWT_SECRET=${{ secrets.DEV_PORTAL_JWT }}
            ADMIN_JWT_SECRET=${{ secrets.DEV_ADMIN_JWT }}
            AZURE_CLIENT_ID=${{ secrets.DEV_AZURE_CLIENT_ID }}
            AZURE_CLIENT_SECRET=${{ secrets.DEV_AZURE_CLIENT_SECRET }}
            AZURE_TENANT_ID=${{ secrets.DEV_AZURE_TENANT_ID }}
            PORTAL_FRONTEND_URL=${{ secrets.DEV_PORTAL_FRONTEND_URL }}
            ADMIN_FRONTEND_URL=${{ secrets.DEV_ADMIN_FRONTEND_URL }}
            PORTAL_API_URL=${{ secrets.DEV_PORTAL_API_URL }}
            ADMIN_API_URL=${{ secrets.DEV_ADMIN_API_URL }}
            EOF

            docker compose -f docker-compose.dev.yml --env-file .env.dev pull
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --remove-orphans
            docker image prune -f
