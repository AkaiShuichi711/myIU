# ─────────────────────────────────────────────────────────────────
#  BASE CONFIG — profile-neutral, structural settings only
#  Secrets / DB URLs / logging levels live in application-{profile}.yml
#  Active profile: set SPRING_PROFILES_ACTIVE env var
#  Default: 'local'  (developer convenience — safe fallback for first run)
# ─────────────────────────────────────────────────────────────────
server:
  forward-headers-strategy: native   # trust X-Forwarded-* from Render/cloud proxy

spring:
  profiles:
    default: local

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jpa:
    open-in-view: false            # prevents N+1 anti-pattern via lazy loading outside TX
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        # Batch writes — group INSERTs/UPDATEs into one DB round-trip
        # same pattern used by Netflix, Dropbox when writing bulk data
        batch_size: 25
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Virtual threads (Java 21 Project Loom)
  # Eliminates thread-per-request overhead; handles I/O-bound load with far fewer OS threads
  # Twitter/Meta use async I/O patterns for exactly this reason
  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          microsoft:
            client-id: ${AZURE_CLIENT_ID}
            client-secret: ${AZURE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/microsoft"
            scope: openid, profile, email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys
            user-name-attribute: email

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ─── SPRING ACTUATOR + PROMETHEUS ───────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: myiu-portal

# ─── OPENAPI / SWAGGER ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── APP COMMON ─────────────────────────────────────────────────
app:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  provision:
    max-create-per-run: ${PROVISION_MAX_CREATE:200}
    max-delete-per-run: ${PROVISION_MAX_DELETE:100}
