# ─────────────────────────────────────────────────────────────────
#  PROD profile — production server
#  DB: myiu_prod  (production database, handled with care)
#  All secrets MUST come from environment variables — no fallbacks
#  Swagger DISABLED, debug logging DISABLED
#  Run: SPRING_PROFILES_ACTIVE=prod
# ─────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/html
    min-response-size: 1024

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: myiu-portal-prod
      # Little's Law: pool = (avg concurrent requests × avg query time in seconds)
      # For a 4-core server handling ~50 rps at 20ms avg query: 50×0.02 = 1 → pool 10-15 is right
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

logging:
  level:
    root: WARN
    com.myiu: WARN
    org.springframework.security: ERROR
    com.zaxxer.hikari: ERROR
  pattern:
    # JSON-like format for log aggregation (Loki/ELK parsing)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %-5level [%X{requestId:-}] %logger{40} - %msg%n"

management:
  endpoint:
    health:
      show-details: never         # don't expose internals on prod health check
  endpoints:
    web:
      exposure:
        include: health,prometheus  # metrics only, no info endpoint on prod

springdoc:
  swagger-ui:
    enabled: false                # Swagger DISABLED on production
  api-docs:
    enabled: false
